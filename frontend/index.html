<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-gymcore-light.png" id="favicon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo-gymcore-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1917" id="theme-color" />
    <script>
      ;(function () {
        var fav = document.getElementById('favicon')
        var tc = document.getElementById('theme-color')
        if (fav) {
          var theme = 'light'
          try {
            var stored = localStorage.getItem('gymcore_theme')
            if (stored === 'dark' || stored === 'light') theme = stored
          } catch (e) {}
          var dark = theme === 'dark'
          fav.setAttribute('href', dark ? '/logo-gymcore-dark.png' : '/logo-gymcore-light.png')
          if (tc) tc.setAttribute('content', dark ? '#1a1917' : '#f5f4f1')
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>GymCore — Gestión de gimnasios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
