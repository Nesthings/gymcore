version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: gymcore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymcore_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gymcore}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - gymcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymcore} -d ${POSTGRES_DB:-gymcore}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymcore_pgdata: